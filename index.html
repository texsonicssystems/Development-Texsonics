    <!-- Inline theme init: reads user preference before first paint to avoid FOUC.
         Default is dark; only an explicit "light" choice switches it. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('texsonics-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.content = '#e7edf1';
            var s = document.querySelector('meta[name="color-scheme"]');
            if (s) s.content = 'light';
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
